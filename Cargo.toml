[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask", "vendor/craft-libs/print", "vendor/craft-libs/ui"]
default-members = ["crates/*", "apps/cella", "apps/cella-cli", "xtask"]

[workspace.package]
version = "0.13.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/Matt-qwq/cella"

[workspace.dependencies]
# internal
cella-core = { path = "crates/core" }
cella-numfmt = { path = "crates/numfmt" }
cella-formula = { path = "crates/formula" }
cella-functions = { path = "crates/functions" }
cella-model = { path = "crates/model" }
cella-calc = { path = "crates/calc" }
cella-xlsx = { path = "crates/xlsx" }
cella-chart = { path = "crates/chart" }
cella-engine = { path = "crates/engine" }
cella-ui-egui = { path = "crates/ui-egui" }
cella-mcp = { path = "crates/mcp" }
cella-pdf = { path = "crates/pdf" }
cella-parquet = { path = "crates/parquet" }
cella-query = { path = "crates/query" }
cella-dax = { path = "crates/dax" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
rayon = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
quick-xml = "0.41"
memchr = "2"
zip = { version = "3", default-features = false, features = ["deflate"] }
# The same deflate the zip crate uses, reached directly so parts can be compressed in parallel.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
crc32fast = "1"
sha2 = { version = "0.11", default-features = false }
# Decrypting password-protected workbooks ([MS-OFFCRYPTO]): AES and SHA-1, pure Rust (wasm-safe).
aes = { version = "0.9", default-features = false }
sha1 = { version = "0.11", default-features = false }
# The operating system's CSPRNG: encryption salts and keys never come from anything weaker.
# Pure Rust, no unsafe in this crate's use of it; native targets only (the web build has no
# secure source it can reach — see `crypto::random_bytes`).
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Text: the Unicode bidirectional algorithm (`unicode-bidi`) and OpenType shaping — Arabic
# joining, Indic reordering, Thai mark positioning, Latin ligatures (`rustybuzz`, a HarfBuzz
# port). Pure Rust, no C, wasm-safe; both MIT/Apache-2.0. `core` is L0, so the engine lives here
# and the grid and the PDF writer share it without either depending on the other.
unicode-bidi = { version = "0.3", default-features = false, features = ["std", "hardcoded-data"] }
rustybuzz = { version = "0.20", default-features = false, features = ["std"] }

# ui
egui = "0.36"
egui_extras = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
arboard = { version = "3.6", default-features = false }
# The desktop's preferred language, for the first-run interface language (native only).
sys-locale = "0.3"
# Font parser egui's epaint uses; the UI validates system font files with it before handing them
# to egui, which panics on a file it can't parse. Same version as epaint's, so no second copy.
skrifa = { version = "0.44", default-features = false, features = ["std"] }
# Real font bytes for tests (Ubuntu Light, compiled into epaint).
epaint_default_fonts = "0.36"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

# Full debug info makes each integration-test executable ~300 MB and a workspace build tens of
# gigabytes; even line tables left them near 200 MB. Dev and test builds carry no debug info by
# default (assertion messages keep test file:line); for a debugging session set
# CARGO_PROFILE_DEV_DEBUG=1 or 2 for that run.
[profile.dev]
opt-level = 1
debug = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
