[package]
name = "cella-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cella command line: inspect, convert, evaluate, script and serve MCP without a window"
publish = false

[lints]
workspace = true

[[bin]]
name = "cella-cli"
path = "src/main.rs"

[dependencies]
cella-engine = { workspace = true, features = ["connectors"] }
cella-mcp = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# `check`: validating the packages Cella writes (content types, relationships).
zip = { workspace = true }
quick-xml = { workspace = true }
