[package]
name = "cella-xlsx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cella file formats: XLSX (SpreadsheetML) and CSV import/export"

[lints]
workspace = true

[features]
# Builds password-encrypted workbooks in code for other crates' tests (a dev-dependency feature;
# never enabled in a shipped build).
test-support = []

[dependencies]
# One part of ours (the model's PivotTables) is JSON: a PivotTable is sixty fields across nested
# structures, and a second hand-written definition of it would be a copy that drifts from the model.
# The queries part stays hand-written. serde_json is also the oracle of tests/queries.rs, which
# proves that part's bytes are the model's own serde shape.
cella-core = { workspace = true }
cella-formula = { workspace = true }
cella-model = { workspace = true }
thiserror = { workspace = true }
quick-xml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
memchr = { workspace = true }
zip = { workspace = true }
flate2 = { workspace = true }
crc32fast = { workspace = true }
aes = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }

# Encryption keys and salts need the OS CSPRNG. The web build has no secure random source we can
# reach (getrandom's `wasm_js` backend would add a JavaScript dependency this repo doesn't take),
# so a password-protected save is refused there instead of made with weak entropy.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = { workspace = true }

[dev-dependencies]
# An independent Compound File Binary reader, used only to prove the encrypted container is valid
# to software that isn't ours (a test oracle; it ships nowhere).
cfb = "0.16"

