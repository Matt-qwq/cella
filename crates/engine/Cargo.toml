[package]
name = "gridcraft-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GridCraft engine: sessions, commands, history, clipboard, fill, sort, filter"

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[dependencies]
gridcraft-core = { workspace = true }
gridcraft-numfmt = { workspace = true }
gridcraft-formula = { workspace = true }
gridcraft-functions = { workspace = true }
gridcraft-model = { workspace = true }
gridcraft-calc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
gridcraft-xlsx = { workspace = true }
gridcraft-parquet = { workspace = true }
gridcraft-query = { workspace = true }
gridcraft-dax = { workspace = true }
gridcraft-chart = { workspace = true }
gridcraft-pdf = { workspace = true }
image = { workspace = true }
rusqlite = { version = "0.43.0", features = ["bundled"], optional = true }
ureq = { version = "3.5.2", optional = true }

[dev-dependencies]
gridcraft-xlsx = { workspace = true, features = ["test-support"] }
zip = { workspace = true }
# The save-identical check in the history tests: `sha2` is already in the workspace (the model
# hashes passwords with it), so this adds no crate to the build.
sha2 = { workspace = true }

[features]
# The two connectors that need the outside world: a SQLite database on disk and a URL over the
# network. Native targets only — the browser build has no sockets and no filesystem, so the web
# app leaves this off and the source kinds report that this build cannot read them. This is the
# dependency decision the owner took on 11-14 (gaps 12): bundled SQLite (a C toolchain, every
# platform we ship) and ureq with rustls (pure-Rust TLS, no OpenSSL).
connectors = ["dep:rusqlite", "dep:ureq"]
