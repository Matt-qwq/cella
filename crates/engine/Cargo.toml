[package]
name = "cella-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cella engine: sessions, commands, history, clipboard, fill, sort, filter"

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[dependencies]
cella-core = { workspace = true }
cella-numfmt = { workspace = true }
cella-formula = { workspace = true }
cella-functions = { workspace = true }
cella-model = { workspace = true }
cella-calc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
cella-xlsx = { workspace = true }
cella-parquet = { workspace = true }
cella-query = { workspace = true }
cella-dax = { workspace = true }
cella-sql = { workspace = true }
cella-chart = { workspace = true }
cella-pdf = { workspace = true }
image = { workspace = true }
rusqlite = { version = "0.43.0", features = ["bundled"], optional = true }
ureq = { version = "3.5.2", optional = true }

[dev-dependencies]
cella-xlsx = { workspace = true, features = ["test-support"] }
zip = { workspace = true }
# The save-identical check in the history tests: `sha2` is already in the workspace (the model
# hashes passwords with it), so this adds no crate to the build.
sha2 = { workspace = true }

[features]
# The two connectors that need the outside world: a SQLite database on disk and a URL over the
# network. Native targets only — the browser build has no sockets and no filesystem, so the web
# app leaves this off and the source kinds report that this build cannot read them. This is the
# dependency decision the owner took on 11-14 (gaps 12): bundled SQLite (a C toolchain, every
# platform we ship) and ureq with rustls (pure-Rust TLS, no OpenSSL).
connectors = ["dep:rusqlite", "dep:ureq"]
# The data model's SQL engine (DuckDB through `cella-sql`): bundled C++, so native only. The
# desktop and CLI apps turn it on; the browser build leaves it off and the engine's commands say
# the model's SQL needs the desktop app. See docs/sql-engine-research.md.
sql-engine = ["cella-sql/duckdb"]