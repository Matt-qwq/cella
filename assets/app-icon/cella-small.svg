<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Cella app icon, enamel, small sizes (16-48 px): the same geometry as cella.svg with the grain
       dropped and the contrast raised, because a 0.85-frequency grain turns into dirt at 16 px and a
       blurred shadow merges with the plate. Bake 16/20/24/32/40/48 from this file, everything else
       from cella.svg (packaging/icons.sh does exactly that). -->
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26272c"/><stop offset=".55" stop-color="#16171b"/><stop offset="1" stop-color="#101114"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".28" cy=".18" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/><stop offset=".6" stop-color="#f2ecdf"/><stop offset="1" stop-color="#ded5c2"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9b5"/><stop offset="1" stop-color="#e9a83a"/>
    </linearGradient>
    <filter id="underC" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="vignette" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#plate)"/>
    <rect width="512" height="512" fill="url(#sheen)"/>
    <path d="M 4 444 C 118 506 394 506 508 444 L 508 516 L 4 516 Z" fill="#000" opacity=".20" filter="url(#vignette)"/>
    <g filter="url(#underC)" opacity=".8">
      <path d="M 344 164 L 196 164 A 52 52 0 0 0 144 216 L 144 312 A 52 52 0 0 0 196 364 L 344 364"
            fill="none" stroke="#000" stroke-width="52" stroke-linecap="round"/>
    </g>
    <path d="M 344 156 L 196 156 A 52 52 0 0 0 144 208 L 144 304 A 52 52 0 0 0 196 356 L 344 356"
          fill="none" stroke="url(#cream)" stroke-width="52" stroke-linecap="round"/>
    <rect x="300" y="226" width="64" height="64" rx="16" fill="#000" opacity=".45" transform="translate(0,3)"/>
    <rect x="300" y="226" width="64" height="64" rx="16" fill="url(#amber)"/>
    <rect x="300" y="226" width="64" height="64" rx="16" fill="none" stroke="#ffeec2" stroke-opacity=".55" stroke-width="2"/>
  </g>
</svg>
