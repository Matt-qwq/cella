<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Cella app icon: the letter C with one cell in its opening.
       Original geometry, hand-written for this repository; no vendor artwork, no vendor likeness.
       Cella is named for the Latin "cella" (a cell, a small chamber) — the word "cell" comes from it.
       Palette: tile #17181c, paper #efe9dc, cell #f7d98a -> #e8a83a. -->
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7d98a"/>
      <stop offset="1" stop-color="#e8a83a"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#17181c"/>
    <path d="M 344 156 L 196 156 A 52 52 0 0 0 144 208 L 144 304 A 52 52 0 0 0 196 356 L 344 356"
          fill="none" stroke="#efe9dc" stroke-width="52" stroke-linecap="round"/>
    <rect x="300" y="226" width="64" height="64" rx="16" fill="url(#lit)"/>
  </g>
</svg>
