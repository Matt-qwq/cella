name: GitHub Pages

on:
  workflow_dispatch:
    inputs:
      design:
        description: Design to publish (studio is the selected homepage)
        type: choice
        required: true
        default: studio
        options:
          - studio
          - compare
          - cell-lab
          - open-print
          - casebook

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stage the static site
        shell: bash
        env:
          DESIGN: ${{ inputs.design }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          out="$RUNNER_TEMP/cella-pages"
          candidates=(studio cell-lab open-print casebook)

          copy_candidate() {
            local source="site-candidates/$1" dest="$2" file
            install -Dm644 "$source/index.html" "$dest/index.html"
            if [[ "$1" == studio ]]; then
              install -Dm644 "$source/en.html" "$dest/en.html"
            fi
            for file in "$source"/*.css "$source"/assets/*.css "$source"/examples/*.csv; do
              install -Dm644 "$file" "$dest/${file#"$source/"}"
            done
          }

          files=(LICENSE-APACHE LICENSE-MIT NOTICE assets/app-icon/LICENSE.txt)
          if [[ "$DESIGN" == studio ]]; then
            files+=(assets/app-icon/cella-small.svg docs/images/{hero-sales,dark-insert,pivot,grades-formulas,budget,format-chart,page-break}{,-zh}.png)
          else
            files+=(assets/app-icon/*.svg assets/app-icon/*.png docs/images/*.png)
          fi
          for file in "${files[@]}"; do
            install -Dm644 "$file" "$out/$file"
          done

          case "$DESIGN" in
            compare)
              for candidate in "${candidates[@]}"; do
                copy_candidate "$candidate" "$out/site-candidates/$candidate"
              done
              sed -E 's#(src|href)="(studio|cell-lab|open-print|casebook)/#\1="site-candidates/\2/#g; s#"\.\./assets/#"assets/#g' \
                site-candidates/index.html > "$out/index.html"
              ;;
            studio|cell-lab|open-print|casebook)
              copy_candidate "$DESIGN" "$out"
              # Candidate sources live two levels below the deployed project root.
              pages=("$out/index.html")
              if [[ "$DESIGN" == studio ]]; then
                pages+=("$out/en.html")
              fi
              sed -i -E 's#"\.\./\.\./(assets|docs)/#"\1/#g' "${pages[@]}"
              ;;
            *) printf 'Unknown design: %s\n' "$DESIGN" >&2; exit 1 ;;
          esac

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/cella-pages

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
